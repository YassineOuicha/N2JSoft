<app-navbar></app-navbar>

<div class="page-container">
    <h2>Users</h2>

    <div class="pager">
        <button mat-stroked-button (click)="toggle()">
            {{ onlyActive ? 'Show all users' : 'Show only active users' }}
        </button>
        <button mat-stroked-button (click)="openCreateDialog()">
            Add user
        </button>
    </div>

    @if (users.length>0) {
        <table mat-table [dataSource]="users" class="mat-elevation-z2">

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Name</th>
                <td mat-cell *matCellDef="let u">
                    {{ u.firstName }} {{ u.lastName }}
                </td>
            </ng-container>

            <ng-container matColumnDef="limit">
                <th mat-header-cell *matHeaderCellDef>Monthly limit</th>
                <td mat-cell *matCellDef="let u">
                    {{ u.monthlyExpenseLimit }}
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let u">
                   <div class="pager">
                       <button mat-stroked-button (click)="openEditDialog(u)">
                           Edit
                       </button>
                       <button mat-stroked-button (click)="delete(u.id)">
                           Delete
                       </button>
                   </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>
    } @else {
        <p>No users found</p>
    }
</div>
