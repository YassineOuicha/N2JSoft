<h3>Add expense details below:</h3>
<div class="form-row">
    <mat-form-field><input matInput placeholder="Description" [(ngModel)]="description" /></mat-form-field>
    <mat-form-field><input matInput type="number" placeholder="Amount (€)" [(ngModel)]="amount" /></mat-form-field>
    <mat-form-field><input matInput placeholder="Brand" [(ngModel)]="brand" /></mat-form-field>
    <button mat-stroked-button (click)="create()">Add</button>
</div>

@if (expenses.length > 0) {
    <table mat-table [dataSource]="expenses" class="mat-elevation-z1">

        <ng-container matColumnDef="desc">
            <th mat-header-cell *matHeaderCellDef>Description</th>
            <td mat-cell *matCellDef="let e">{{ e.description }}</td>
        </ng-container>

        <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef>Amount</th>
            <td mat-cell *matCellDef="let e">{{ e.amount }} €</td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let e">
                <button mat-stroked-button (click)="delete(e.id)">Delete</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['desc','amount','actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['desc','amount','actions'];"></tr>

    </table>

    <mat-paginator
            [length]="totalCount"
            [pageSize]="pageSize"
            [pageIndex]="pageNumber - 1"
            [pageSizeOptions]="[5]"
            showFirstLastButtons
            (page)="onPageChange($event)">
    </mat-paginator>
}
