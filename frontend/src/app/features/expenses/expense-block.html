<button mat-stroked-button (click)="openCreateDialog()">
    Add expense details
</button>

@if (expenses.length > 0) {
    <table mat-table [dataSource]="expenses" class="mat-elevation-z1">

        <ng-container matColumnDef="desc">
            <th mat-header-cell *matHeaderCellDef>Description</th>
            <td mat-cell *matCellDef="let e">{{ e.description }}</td>
        </ng-container>

        <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef>Amount</th>
            <td mat-cell *matCellDef="let e">{{ e.amount }} €</td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let e">
                <div class="pager">
                    <button mat-stroked-button (click)="openEditDialog(e)">Edit</button>
                    <button mat-stroked-button (click)="delete(e.id)">Delete</button>
                </div>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['desc','amount','actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['desc','amount','actions'];"></tr>

    </table>

    <mat-paginator
            [length]="totalCount"
            [pageSize]="pageSize"
            [pageIndex]="pageNumber - 1"
            [pageSizeOptions]="[5]"
            showFirstLastButtons
            (page)="onPageChange($event)">
    </mat-paginator>
}
