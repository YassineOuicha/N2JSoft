<app-navbar></app-navbar>

<div class="page-container">
    <h2>Expense reports</h2>

    <div class="form-row">
        <mat-form-field>
            <mat-label>Select a user</mat-label>
            <mat-select [(ngModel)]="selectedUserId">
                @for (user of users; track user.id) {
                    <mat-option [value]="user.id">
                        {{ user.firstName }} {{ user.lastName }}
                    </mat-option>
                }
            </mat-select>
        </mat-form-field>

        <mat-form-field>
            <mat-label>Year</mat-label>
            <input matInput type="number" [(ngModel)]="year" />
        </mat-form-field>

        <mat-form-field>
            <mat-label>Month</mat-label>
            <input matInput type="number" [(ngModel)]="month" />
        </mat-form-field>

        <button mat-stroked-button (click)="create()">
            Create
        </button>
    </div>

    @if (reports.length > 0) {
        <table mat-table [dataSource]="reports" class="mat-elevation-z2">
            <ng-container matColumnDef="title">
                <th mat-header-cell *matHeaderCellDef>Title</th>
                <td mat-cell *matCellDef="let r">
                    <a [routerLink]="['/expense-reports', r.id]">
                        {{ r.title }}
                    </a>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let r">
                    <button mat-stroked-button (click)="delete(r.id)">
                        Delete
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="['title','actions']"></tr>
            <tr mat-row *matRowDef="let row; columns: ['title','actions'];"></tr>
        </table>
    }
</div>
